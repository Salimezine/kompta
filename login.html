<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - ComptaFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00B5BD; --primary-hover: #009ca3;
            --secondary: #0D2A3B; --bg: #F4FAFA;
            --white: #fff; --text-light: #4A6572;
            --gray: #E2E8F0; --error: #EF4444;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #0D2A3B 0%, #154360 50%, #00B5BD 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .auth-wrapper {
            display: flex; width: 100%; max-width: 900px;
            background: var(--white); border-radius: 24px;
            overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.3);
        }
        .auth-left {
            flex: 1;
            background: linear-gradient(160deg, #0D2A3B, #00B5BD);
            padding: 60px 50px; color: white;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center;
        }
        .auth-left .logo {
            font-family: 'Sora', sans-serif; font-size: 1.8rem; font-weight: 800;
            display: flex; align-items: center; gap: 10px; margin-bottom: 50px;
            text-decoration: none; color: white;
        }
        .big-icon {
            width: 120px; height: 120px; background: rgba(255,255,255,0.15);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 3.5rem; margin: 0 auto 30px;
            animation: pulse 3s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.3); }
            70% { box-shadow: 0 0 0 20px rgba(255,255,255,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
        }
        .auth-left h2 { font-family: 'Sora', sans-serif; font-size: 1.8rem; margin-bottom: 15px; }
        .auth-left p { opacity: 0.8; font-size: 1.05rem; }
        .auth-right { flex: 1; padding: 60px 50px; }
        .auth-right h1 { font-family: 'Sora', sans-serif; font-size: 1.8rem; color: var(--secondary); margin-bottom: 8px; }
        .auth-right .subtitle { color: var(--text-light); margin-bottom: 35px; }
        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--secondary); font-size: 0.95rem; }
        .form-group .input-wrap { position: relative; }
        .form-group .input-wrap i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-light); }
        .form-control {
            width: 100%; padding: 13px 15px 13px 42px;
            border: 1.5px solid var(--gray); border-radius: 10px;
            font-family: inherit; font-size: 1rem; color: var(--secondary);
            transition: all 0.3s; background: var(--bg);
        }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0,181,189,0.1); background: white; }
        .forgot { text-align: right; margin-top: -15px; margin-bottom: 20px; }
        .forgot a { color: var(--primary); font-size: 0.9rem; text-decoration: none; font-weight: 500; }
        .btn-submit {
            width: 100%; padding: 15px; background: var(--primary); color: white;
            border: none; border-radius: 10px; font-family: inherit; font-size: 1.05rem;
            font-weight: 700; cursor: pointer; transition: all 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-submit:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,181,189,0.4); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        .signup-link { text-align: center; margin-top: 25px; color: var(--text-light); }
        .signup-link a { color: var(--primary); font-weight: 700; text-decoration: none; }
        .error-msg {
            background: #FEF2F2; color: var(--error); padding: 12px 16px; border-radius: 8px;
            margin-bottom: 20px; font-size: 0.95rem; display: none; align-items: center; gap: 10px;
            border: 1px solid #FECACA;
        }
        .error-msg.show { display: flex; }
        .demo-hint {
            background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: 10px;
            padding: 14px 16px; margin-bottom: 25px; font-size: 0.9rem; color: #1E40AF;
            display: flex; align-items: center; gap: 10px;
        }
        @media (max-width: 768px) {
            .auth-left { display: none; }
            .auth-right { padding: 40px 30px; }
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-left">
            <a href="index.html" class="logo"><i class="fa-solid fa-file-invoice-dollar"></i> ComptaFlow</a>
            <div class="big-icon">🤖</div>
            <h2>Bon retour parmi nous !</h2>
            <p>Votre assistant comptable IA vous attend pour traiter vos documents.</p>
        </div>

        <div class="auth-right">
            <h1>Se connecter</h1>
            <p class="subtitle">Accédez à votre tableau de bord ComptaFlow.</p>

            <div class="demo-hint">
                <i class="fa-solid fa-lightbulb"></i>
                <span>Pas encore de compte ? <a href="signup.html" style="color:#1E40AF; font-weight:700;">Créez-en un gratuitement →</a></span>
            </div>

            <div class="error-msg" id="errorMsg">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="errorText"></span>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Adresse Email</label>
                    <div class="input-wrap">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="loginEmail" class="form-control" placeholder="vous@entreprise.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Mot de passe</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="loginPassword" class="form-control" placeholder="Votre mot de passe" required>
                    </div>
                </div>

                <div class="forgot"><a href="#">Mot de passe oublié ?</a></div>

                <button type="submit" class="btn-submit" id="loginBtn">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Se connecter
                </button>
            </form>

            <p class="signup-link">Pas encore de compte ? <a href="signup.html">S'inscrire gratuitement</a></p>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        if (Auth.getCurrentUser()) window.location.href = 'dashboard.html';

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            errorMsg.classList.remove('show');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connexion...';

            setTimeout(() => {
                const result = Auth.login(email, password);
                if (result.success) {
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> Connecté ! Redirection...';
                    btn.style.background = '#10B981';
                    setTimeout(() => window.location.href = 'dashboard.html', 800);
                } else {
                    errorText.textContent = result.error;
                    errorMsg.classList.add('show');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Se connecter';
                }
            }, 700);
        });
    </script>
</body>
</html>
